      <polygon points="24,11 27.53,19.14 36.34,19.83 29.59,25.53 31.74,34.1 24,29.48 16.26,34.1 18.41,25.53 11.66,19.83 20.47,19.14" fill="#ffe600"/>
      <circle cx="24" cy="24" r="22" fill="url(#shade)"/>
      <ellipse cx="24" cy="13.5" rx="18" ry="11" fill="url(#gloss)"/>
      <path d="M10 10c6-4 20-5 28 0" fill="none" stroke="#ffffff" stroke-opacity="0.52" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M8 20c5-1 9-1.5 13-1.2" fill="none" stroke="#ffffff" stroke-opacity="0.20" stroke-width="3" stroke-linecap="round"/>
    </g>
    <circle cx="24" cy="24" r="21.2" fill="none" stroke="#ffffff" stroke-opacity="0.65" stroke-width="0.9"/>
    <circle cx="24" cy="24" r="22" fill="none" stroke="#000000" stroke-opacity="0.18" stroke-width="1"/>
  </g>
