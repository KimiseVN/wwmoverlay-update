<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" role="img" aria-label="Russian flag button">
  <defs>
    <clipPath id="clipCircle"><circle cx="24" cy="24" r="22"/></clipPath>
    <radialGradient id="shade" cx="35%" cy="28%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.18"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.78"/>
      <stop offset="48%" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.6" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <g clip-path="url(#clipCircle)">
      <rect x="2" y="2" width="44" height="14.6667" fill="#f6f7fb"/>
      <rect x="2" y="16.6667" width="44" height="14.6667" fill="#173bf0"/>
      <rect x="2" y="31.3334" width="44" height="14.6666" fill="#f82620"/>
      <circle cx="24" cy="24" r="22" fill="url(#shade)"/>
      <ellipse cx="24" cy="13.5" rx="18" ry="11" fill="url(#gloss)"/>
      <path d="M10 10c6-4 20-5 28 0" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2.2" stroke-linecap="round"/>
      <ellipse cx="24" cy="36" rx="15" ry="6.6" fill="#ffffff" opacity="0.16"/>
    </g>
    <circle cx="24" cy="24" r="21.2" fill="none" stroke="#ffffff" stroke-opacity="0.70" stroke-width="0.9"/>
    <circle cx="24" cy="24" r="22" fill="none" stroke="#000000" stroke-opacity="0.30" stroke-width="1"/>
  </g>
</svg>
