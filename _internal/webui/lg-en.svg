<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" role="img" aria-label="English flag button">
  <defs>
    <clipPath id="clipCircle"><circle cx="24" cy="24" r="22"/></clipPath>
    <radialGradient id="shade" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.18"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.72"/>
      <stop offset="48%" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.6" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <circle cx="24" cy="24" r="22" fill="#1f1f1f" opacity="0.08"/>
  <g filter="url(#shadow)">
    <circle cx="24" cy="24" r="22" fill="#0f2f8f"/>
    <g clip-path="url(#clipCircle)">
      <rect x="2" y="2" width="44" height="44" fill="#12338d"/>

      <!-- White diagonals -->
      <polygon points="2,7 7,2 46,41 41,46" fill="#ffffff"/>
      <polygon points="41,2 46,7 7,46 2,41" fill="#ffffff"/>

      <!-- Red diagonals -->
      <polygon points="2,10.5 10.5,2 46,37.5 37.5,46" fill="#d81e34"/>
      <polygon points="37.5,2 46,10.5 10.5,46 2,37.5" fill="#d81e34"/>

      <!-- White central cross -->
      <rect x="18" y="2" width="12" height="44" fill="#ffffff"/>
      <rect x="2" y="18" width="44" height="12" fill="#ffffff"/>

      <!-- Red central cross -->
      <rect x="20.5" y="2" width="7" height="44" fill="#d81e34"/>
      <rect x="2" y="20.5" width="44" height="7" fill="#d81e34"/>

      <!-- Shading + gloss -->
      <circle cx="24" cy="24" r="22" fill="url(#shade)"/>
      <ellipse cx="24" cy="14" rx="18" ry="11" fill="url(#gloss)"/>
      <path d="M10 10c6-4 20-5 28 0" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2.2" stroke-linecap="round"/>
      <ellipse cx="24" cy="36" rx="15" ry="7" fill="#000000" opacity="0.06"/>
    </g>
    <circle cx="24" cy="24" r="21.2" fill="none" stroke="#ffffff" stroke-opacity="0.70" stroke-width="0.9"/>
    <circle cx="24" cy="24" r="22" fill="none" stroke="#000000" stroke-opacity="0.18" stroke-width="1"/>
  </g>
</svg>
